map "$arg_version:$cookie_indoor_release" $indoor_release {
    default "1017-stairs";
    ~^0804b: "0804b";
    ~^1017-stairs: "1017-stairs";
    ":0804b" "0804b";
}
server {
    listen 8080;
    server_name _;
    root /releases/$indoor_release;
    index index.html;
    access_log off;
    add_header X-Indoor-Release $indoor_release always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Vary Cookie always;
    add_header Cache-Control "no-cache" always;
    location = /__releases/picker.js {
        alias /release-picker.js;
        default_type application/javascript;
    }
    location = /__releases/current {
        default_type application/json;
        return 200 '{"release":"$indoor_release"}';
    }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location /_next/static/ {
        root /shared;
        try_files $uri =404;
    }
    location / {
        sub_filter_once on;
        sub_filter '</head>' '<meta name="indoor-release" content="$indoor_release"><script src="/__releases/picker.js" defer></script></head>';
        try_files $uri.html $uri $uri/ /index.html;
    }
}
